name: Build Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned build tools
        shell: powershell
        run: ./scripts/get-build-tools.ps1
      - name: Build app and installer
        shell: powershell
        run: ./scripts/build.ps1
      - name: Run regression checks
        shell: powershell
        run: ./scripts/test.ps1
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Auto-Hotkeys-Windows
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: Auto-Hotkeys-Windows
          path: dist
      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "Auto-Hotkeys ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
